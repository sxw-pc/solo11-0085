[build-system]
requires = ["setuptools>=69,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "jobtrace"
version = "0.1.0"
description = "Offline synthetic job metadata collection and lifecycle ledger"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
  "Jinja2>=3.1,<4",
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[tool.setuptools.packages.find]
include = ["jobtrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}职迹采复核台{% endblock %}</title>
  <style>
    :root { color-scheme: light; --ink:#17212b; --muted:#697782; --line:#dfe5e8; --accent:#0f6b5c; --bg:#f5f7f6; }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
    header { background:#fff; border-bottom:1px solid var(--line); }
    .wrap { max-width:1120px; margin:0 auto; padding:20px; }
    header .wrap { display:flex; align-items:center; justify-content:space-between; gap:18px; }
    .brand { font-weight:750; color:var(--accent); text-decoration:none; }
    nav a { color:var(--muted); text-decoration:none; margin-left:16px; }
    nav a:hover { color:var(--accent); }
    h1 { font-size:1.65rem; margin:.4rem 0 1rem; }
    h2 { font-size:1.15rem; margin-top:1.8rem; }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:18px 0; }
    .stat { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
    .stat strong { display:block; font-size:1.5rem; }
    .stat span { color:var(--muted); font-size:.9rem; }
    table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); }
    th, td { text-align:left; padding:9px 11px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; background:#fafbfb; }
    tr:last-child td { border-bottom:0; }
    code { background:#edf2f1; border-radius:4px; padding:1px 5px; }
    .badge { display:inline-block; border-radius:999px; padding:1px 9px; font-size:.82rem; }
    .open { background:#e3f3ed; color:#11634f; }
    .closed { background:#eceff1; color:#59646b; }
    .complete { background:#e3f3ed; color:#11634f; }
    .incomplete, .failed { background:#fbe8e5; color:#983b2c; }
    .running { background:#fff2d9; color:#805b12; }
    .muted { color:var(--muted); }
    .tags { display:flex; gap:6px; flex-wrap:wrap; padding:0; list-style:none; }
    .tags li { background:#e8f3ef; border-radius:999px; padding:2px 10px; font-size:.85rem; }
    .notice { border-left:3px solid var(--accent); padding:8px 14px; background:#fff; }
    @media (max-width:760px) { .grid { grid-template-columns:repeat(2,1fr); } header .wrap { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <header><div class="wrap">
    <a class="brand" href="/">职迹采 · 只读复核台</a>
    <nav><a href="/">总览</a><a href="/events">事件</a><a href="/runs">运行</a></nav>
  </div></header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
